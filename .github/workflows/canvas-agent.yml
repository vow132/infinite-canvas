name: canvas-agent

on:
  push:
    branches: [main]
    paths:
      - "canvas-agent/package.json"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          package_versions=$(npm view "$package_name" versions --json)
          if node -e 'process.exit([].concat(JSON.parse(process.argv[1])).includes(process.argv[2]) ? 0 : 1)' "$package_versions" "$package_version"; then
            echo "$package_name@$package_version 已发布，跳过"
          else
            npm publish
          fi
        working-directory: canvas-agent
